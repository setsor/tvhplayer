name: Build TVHplayer (macOS Intel)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/macos-intel-reproducible
      - test/macos-integration-build
      - release/macos-intel-all-improvements
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install verified Python 3.15.0 (official macOS package)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/python-3.15.0-macos11.pkg" \
            'https://www.python.org/ftp/python/3.15.0/python-3.15.0-macos11.pkg'
          echo "7c7e7eca61cbfa5f0c6f80cd594cddbfd492f4e8b3fb87e3d9fa1efebaec43ed  $RUNNER_TEMP/python-3.15.0-macos11.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/python-3.15.0-macos11.pkg" -target / >/dev/null
          /Library/Frameworks/Python.framework/Versions/3.15/bin/python3.15 --version

      - name: Install pinned build dependencies
        shell: bash
        run: |
          set -euo pipefail
          /Library/Frameworks/Python.framework/Versions/3.15/bin/python3.15 -m venv "$RUNNER_TEMP/tvhplayer-venv"
          "$RUNNER_TEMP/tvhplayer-venv/bin/python" -m pip install -r macos/requirements-build.txt
          "$RUNNER_TEMP/tvhplayer-venv/bin/python" -m pip check
          "$RUNNER_TEMP/tvhplayer-venv/bin/python" -c 'import ast, pathlib; ast.parse(pathlib.Path("macos/tvhplayer/tvhplayer.py").read_text(encoding="utf-8"))'
          echo "$RUNNER_TEMP/tvhplayer-venv/bin" >> "$GITHUB_PATH"

      - name: Test DVR classification and diagnostic redaction
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tvhplayer-venv/bin/python" -m unittest discover -s macos/tests -v

      - name: Download verified VLC 3.0.24 (Intel)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/vlc-3.0.24-intel64.dmg" \
            'https://get.videolan.org/vlc/3.0.24/macosx/vlc-3.0.24-intel64.dmg'
          echo "1ef6c903e2dc026d4e58ddf7b2a9ed0eb6f8caf80a9a9f46f96490340b962707  $RUNNER_TEMP/vlc-3.0.24-intel64.dmg" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/vlc-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/vlc-mount" "$RUNNER_TEMP/vlc-3.0.24-intel64.dmg" >/dev/null
          test -f "$RUNNER_TEMP/vlc-mount/VLC.app/Contents/MacOS/lib/libvlc.dylib"
          # Ephemeral runner only: mirror the developer's tested VLC installation.
          sudo rm -rf /Applications/VLC.app
          sudo ditto "$RUNNER_TEMP/vlc-mount/VLC.app" /Applications/VLC.app
          hdiutil detach "$RUNNER_TEMP/vlc-mount" >/dev/null
          python -c 'import vlc; assert vlc.libvlc_get_version().decode().startswith("3.0.24")'

      - name: Build and inspect macOS application
        shell: bash
        run: |
          set -euo pipefail
          bash macos/build-macos.sh
          APP='macos/dist/TVHplayer.app'
          file "$APP/Contents/MacOS/TVHplayer"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")" = TVHplayer
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" = TVHplayer
          test ! -e "$APP/Contents/Frameworks/vlc/plugins/plugins.dat"
          test -f "$APP/Contents/Frameworks/icons/play.svg"
          codesign --verify --deep --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" macos/dist/TVHplayer.zip
          bash macos/package-dmg.sh
          test -s macos/dist/TVHplayer.dmg
          test -s macos/dist/TVHplayer.dmg.sha256

      - name: Upload app archive
        uses: actions/upload-artifact@v7
        with:
          name: TVHplayer-macOS-Intel-${{ github.sha }}
          path: |
            macos/dist/TVHplayer.zip
            macos/dist/TVHplayer.dmg
            macos/dist/TVHplayer.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish macOS Intel DMG to fork Releases
    needs: macos-intel
    if: >-
      github.repository == 'setsor/tvhplayer' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/macos-intel-all-improvements' &&
      startsWith(github.event.head_commit.message, 'release(macos):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v7
        with:
          name: TVHplayer-macOS-Intel-${{ github.sha }}
          path: artifacts

      - name: Validate checksum and publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 -c TVHplayer.dmg.sha256
          TAG="macos-intel-preview-${GITHUB_SHA:0:8}"
          cat > release-notes.md <<'NOTES'
          ### TVHplayer for Intel macOS (development preview)

          Download **TVHplayer.dmg**. Open it and drag the app to
          Applications. Install **VLC 3.0.24** in /Applications first; it supplies
          native playback libraries not included with TVHplayer.

          Includes the tested EPG scheduling fixes, accurate DVR statuses
          (including missed and missing-file recordings), quieter redacted
          diagnostics, and improved macOS icon/font handling.

          Built with Python 3.15 and PyInstaller 6.22.3. Tested on macOS
          Ventura 13.7.8 for the earlier integration build. This exact revision
          must still be verified on a real Mac.

          Ad-hoc signed; not Apple Developer ID signed or notarized.
          NOTES
          gh release create "$TAG" \
            TVHplayer.dmg \
            TVHplayer.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TVHplayer macOS Intel preview (${GITHUB_SHA:0:8})" \
            --notes-file release-notes.md \
            --prerelease --latest=false

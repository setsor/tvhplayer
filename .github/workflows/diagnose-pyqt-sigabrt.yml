name: Diagnose PyQt6 SIGABRT (4.7.6, isolated)

on:
  push:
    branches:
      - diagnostic/4.7.6-pyqt-sigabrt
  pull_request:
    paths:
      - '.github/workflows/diagnose-pyqt-sigabrt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2025
            python: '3.13'
          - os: macos-15
            python: '3.15'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libmpv2 ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) reqs=windows/requirements-build.txt ;;
            macOS) reqs=macos/requirements-build.txt ;;
            *) reqs=runtime-requirements.txt ;;
          esac
          python -m pip install --upgrade pip
          python -m pip install -r "$reqs" PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools
          python packaging/build-native.py
      - name: Diagnose isolated versus sequential Qt tests
        shell: bash
        run: |
          mkdir -p diagnostics
          failed=0
          check() {
            label="$1"
            mode="$2"
            shift 2
            echo "::group::$label"
            set +e
            TVHPLAYER_DIAG_NO_MODULE_RELOAD="$mode" PYTHONUNBUFFERED=1 python -X faulthandler -m pytest -vv -s --tb=short --timeout=300 -p no:cacheprovider "$@" > "diagnostics/$label.log" 2>&1
            code=$?
            set -e
            echo "$label exit=$code" | tee -a diagnostics/results.txt
            tail -n 75 "diagnostics/$label.log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          set -e
          # 0 = original per-window module reload; 1 = reuse imported UI module.
          check baseline-dvr 0 tests/test_pyqt6_ui.py -k 'test_builtin_server_records_through_one_window'
          check reuse-dvr 1 tests/test_pyqt6_ui.py -k 'test_builtin_server_records_through_one_window'
          check baseline-layout 0 tests/test_pyqt6_ui.py -k 'test_long_group_and_server_names_do_not_widen_the_channel_pane'
          check reuse-layout 1 tests/test_pyqt6_ui.py -k 'test_long_group_and_server_names_do_not_widen_the_channel_pane'
          check baseline-sequence 0 tests/test_pyqt6_ui.py -k 'test_recording_from_timeshift_uses_the_captured_position or test_builtin_server_records_through_one_window'
          check reuse-sequence 1 tests/test_pyqt6_ui.py -k 'test_recording_from_timeshift_uses_the_captured_position or test_builtin_server_records_through_one_window'
          # Independently reproduce the three remaining platform failures.
          # Keep original pytest output unmodified for attribution.
          check isolated-quit-lookup 0 tests/test_pyqt6_ui.py -k 'test_quit_asks_the_builtin_server_even_when_another_is_selected'
          check isolated-instance-activation 0 tests/test_background.py -k 'test_second_launch_activates_owner_and_lock_is_reusable'
          # Determine whether failure depends on earlier tests in the same
          # UI module, on earlier test modules, or on all-suite interactions.
          check quit-group 0 tests/test_pyqt6_ui.py -k 'quit'
          check ui-file-only 0 tests/test_pyqt6_ui.py -x
          check baseline-suite 0 tests -x
          check reuse-suite 1 tests -x
          {
            echo "### PyQt6 SIGABRT isolation (${{ matrix.os }})"
            echo '~~~'
            cat diagnostics/results.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$failed" > diagnostics/has-failures.txt
      - name: Upload diagnostic logs, even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyqt-sigabrt-${{ matrix.os }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Mark diagnostic failures without masking them
        shell: bash
        run: |
          if [ ! -f diagnostics/has-failures.txt ]; then
            echo 'Diagnostics did not complete' >&2
            exit 1
          fi
          if [ "$(cat diagnostics/has-failures.txt)" != 0 ]; then
            echo 'At least one isolated or sequential test failed; inspect uploaded logs.' >&2
            exit 1
          fi

name: Diagnose PyQt6 SIGABRT (4.7.6, isolated)

on:
  push:
    branches:
      - diagnostic/4.7.6-pyqt-sigabrt
      - diagnostic/linux-qt-tasks-fetch
  pull_request:
    paths:
      - '.github/workflows/diagnose-pyqt-sigabrt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only Ubuntu while investigating worker cleanup.
          - os: ubuntu-24.04
            python: '3.12'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libmpv2 ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) reqs=windows/requirements-build.txt ;;
            macOS) reqs=macos/requirements-build.txt ;;
            *) reqs=runtime-requirements.txt ;;
          esac
          python -m pip install --upgrade pip
          python -m pip install -r "$reqs" PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools
          python packaging/build-native.py
      - name: Diagnose isolated versus sequential Qt tests
        shell: bash
        run: |
          mkdir -p diagnostics
          failed=0
          check() {
            label="$1"
            mode="$2"
            shift 2
            echo "::group::$label"
            set +e
            TVHPLAYER_DIAG_NO_MODULE_RELOAD="$mode" PYTHONUNBUFFERED=1 python -X faulthandler -m pytest -vv -s --tb=short --timeout=300 -p no:cacheprovider "$@" > "diagnostics/$label.log" 2>&1
            code=$?
            set -e
            echo "$label exit=$code" | tee -a diagnostics/results.txt
            tail -n 75 "diagnostics/$label.log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          set -e
          # Single Ubuntu CPU attribution check. Each command runs in a
          # separate Python process; compare isolated targets with the
          # full responsiveness module while preserving the 250 ms budget.
          check responsiveness-isolated-cpu 1 tests/test_responsiveness.py -k 'test_guide_import_updates_keep_the_list_answering or test_a_big_list_arriving_keeps_the_window_answering'
          check responsiveness-module-cpu 1 tests/test_responsiveness.py
          {
            echo "### PyQt6 SIGABRT isolation (${{ matrix.os }})"
            echo '~~~'
            cat diagnostics/results.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$failed" > diagnostics/has-failures.txt
      - name: Upload diagnostic logs, even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyqt-sigabrt-${{ matrix.os }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Mark diagnostic failures without masking them
        shell: bash
        run: |
          if [ ! -f diagnostics/has-failures.txt ]; then
            echo 'Diagnostics did not complete' >&2
            exit 1
          fi
          if [ "$(cat diagnostics/has-failures.txt)" != 0 ]; then
            echo 'At least one isolated or sequential test failed; inspect uploaded logs.' >&2
            exit 1
          fi

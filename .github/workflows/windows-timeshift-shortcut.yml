name: Diagnose Windows timeshift shortcut

on:
  push:
    branches:
      - fix/4.7.6-compact-server-controls
  pull_request:
    paths:
      - 'tests/test_pyqt6_ui.py'
      - '.github/workflows/windows-timeshift-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortcut:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install runtime and tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements-build.txt PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools
          python packaging/build-native.py
      - name: Run only the buffer shortcut case with verbose stage markers
        shell: pwsh
        run: |
          python -u -X faulthandler -m pytest -vv -s --tb=long --timeout=120 -p no:cacheprovider tests/test_pyqt6_ui.py -k 'test_builtin_server_records_through_one_window and buffer-local_shortcut' 2>&1 | Tee-Object windows-timeshift-shortcut.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

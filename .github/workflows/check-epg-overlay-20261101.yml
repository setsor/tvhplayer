name: Check five-second programme overlay

on:
  push:
    branches:
      - ci/epg-overlay-20261101
    paths:
      - .github/workflows/check-epg-overlay-20261101.yml

permissions:
  contents: read

jobs:
  qt-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout exact EPG revision
        uses: actions/checkout@v7
        with:
          ref: 4b4a96b27a515bf54dab7cee38d81e40f6384931
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Qt and application dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e . pytest
          python -m pip check
      - name: Check EPG, startup and playback transitions
        run: |
          python -m pytest -q tests/test_pyqt6_ui.py \
            -k 'test_epg_overlay_starts_with_picture_and_expires_after_five_seconds or test_epg_overlay_uses_plain_text_and_keeps_subtitle_space or test_selected_channel_logo_replaces_idle_splash_and_survives_stop or test_spinner_shows_until_playback_starts or test_playback_surface_ignores_transient_stop_and_qt_paints or test_record_controls_follow_the_playing_channel_not_the_selected_row'
      - name: Check channel EPG and UI syntax
        run: |
          python -m pytest -q tests/test_channel_view.py -k 'test_no_epg_is_displayed_only_after_successful_now_next_fetch'
          python -m py_compile tvhplayer/tvhplayer.py tvhplayer/channel_view.py tests/test_pyqt6_ui.py

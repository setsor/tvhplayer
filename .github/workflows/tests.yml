name: macOS - EPG latency A/B diagnostic

on:
  push:
    branches:
      - diagnostic/macos-epg-latency-4.7.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install mpv ffmpeg
          python -m pip install -r macos/requirements-build.txt PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools
          python packaging/build-native.py
      - name: Compare six complete responsiveness runs on one runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p latency-results
          failed=0
          for trial in 1 2 3 4 5 6; do
            if (( trial % 2 == 1 )); then mode=original; else mode=cached; fi
            export TVH_DIAG_TUNERS="$mode"
            export TVH_DIAG_JSON="$PWD/latency-results/$trial-$mode.jsonl"
            echo "::group::Trial $trial ($mode)"
            if ! python -m pytest tests/test_responsiveness.py -vv --tb=short -ra -p no:cacheprovider --timeout=300 --junitxml="latency-results/$trial-$mode.xml" 2>&1 | tee "latency-results/$trial-$mode.log"; then
              failed=1
            fi
            cat "$TVH_DIAG_JSON" || true
            echo "::endgroup::"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = ["## EPG benchmark (unchanged 50 ms threshold)", "", "| Trial | Mode | Groups | Worst ms | p99 ms | Tuner starts |", "| --- | --- | ---: | ---: | ---: | ---: |"]
          for path in sorted(Path("latency-results").glob("*.jsonl")):
              for line in path.read_text().splitlines():
                  d = json.loads(line)
                  starts = sum(event[0] == "start" for event in d["tuner_events"])
                  rows.append("| %s | %s | %d | %.2f | %.2f | %d |" % (path.stem, d["mode"], d["groups"], d["worst_ms"], d["p99_ms"], starts))
          print("\n".join(rows))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(rows) + "\n")
          PY
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-epg-latency-results
          path: latency-results/
          if-no-files-found: warn
          retention-days: 14

name: macOS - release synthetic channel fixture payloads
on:
  push:
    branches:
      - diagnostic/macos-epg-latency-4.7.6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install mpv ffmpeg
          python -m pip install -r macos/requirements-build.txt PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools
          python packaging/build-native.py
          python -m py_compile tests/test_responsiveness.py tests/diagnostic_scheduler_probe.py
      - name: Compare normal teardown with explicit payload release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p latency-results
          failed=0
          for trial in 1 2 3 4 5 6 7 8; do
            if (( trial % 2 == 1 )); then mode=baseline; else mode=release; fi
            export TVH_DIAG_CLEANUP="$mode"
            export TVH_DIAG_JSON="$PWD/latency-results/$trial-$mode-trace.jsonl"
            python tests/diagnostic_scheduler_probe.py > "latency-results/$trial-probe.jsonl" &
            probe=$!
            echo "::group::Trial $trial"
            if ! python -m pytest tests/test_responsiveness.py -vv --tb=short -ra -p no:cacheprovider --timeout=300 --junitxml="latency-results/$trial.xml" 2>&1 | tee "latency-results/$trial.log"; then
              failed=1
            fi
            kill "$probe" 2>/dev/null || true
            wait "$probe" 2>/dev/null || true
            cat "$TVH_DIAG_JSON" || true
            cat "$TVH_DIAG_JSON.lifetime" || true
            echo "::endgroup::"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = ["## Stall attribution (original thresholds)", "", "| Trial | Test | Worst ms | Main CPU ms in worst gap | Largest overlapping main operation | Independent process gap ms |", "|---|---|---:|---:|---|---:|"]
          for path in sorted(Path("latency-results").glob("*-trace.jsonl")):
              trial, mode, _ = path.name.split("-", 2)
              probe_path = path.with_name(trial + "-probe.jsonl")
              probe = [json.loads(line) for line in probe_path.read_text().splitlines()]
              for line in path.read_text().splitlines():
                  d = json.loads(line)
                  gap = d["gaps"][0]
                  main = [op for op in gap["operations"] if op["main"]]
                  operation = ("%s %.1f ms (CPU %s)" % (main[0]["name"], main[0]["wall_ms"], main[0]["cpu_ms"])) if main else "-"
                  overlap = [p["ms"] for p in probe if p["start"] <= gap["end"] and p["end"] >= gap["start"]]
                  rows.append("| %s-%s | %s | %.2f | %s | %s | %.2f |" % (trial, mode, d["test"], d["worst_ms"], gap["main_cpu_ms"], operation, max(overlap, default=0)))
          print("\n".join(rows))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(rows) + "\n")
          PY
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-fixture-release
          path: latency-results/
          if-no-files-found: warn
          retention-days: 14

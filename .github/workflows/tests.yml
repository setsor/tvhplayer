name: Tests

# The whole test suite on Linux, Windows and macOS, on every push and pull
# request, so a change that breaks one platform shows up before a release.
# Packages are not built here; the platform build workflows do that.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python each platform's package ships with.
          - os: ubuntu-24.04
            python: '3.12'
          # Temporary Linux-only validation. Restore other platforms before review.
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libmpv2 ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) reqs=windows/requirements-build.txt ;;
            macOS) reqs=macos/requirements-build.txt ;;
            *) reqs=runtime-requirements.txt ;;
          esac
          python -m pip install --upgrade pip
          # Linux packages take PyQt6 from the distribution; here it comes from pip.
          python -m pip install -r "$reqs" PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools

      - name: Build the C decoder
        id: native_decoder
        run: python packaging/build-native.py

      # Run Linux responsiveness benchmarks in a fresh interpreter. Earlier
      # Qt tests otherwise retain widgets/callbacks and distort timing.
      - name: Run correctness tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest tests --ignore=tests/test_responsiveness.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra

      - name: Run responsiveness tests (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.native_decoder.outcome == 'success' }}
        run: python -m pytest tests/test_responsiveness.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest tests -q -p no:cacheprovider --timeout=300 -ra

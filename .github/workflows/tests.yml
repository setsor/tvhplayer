name: Tests

# The whole test suite on Linux, Windows and macOS, on every push and pull
# request, so a change that breaks one platform shows up before a release.
# Packages are not built here; the platform build workflows do that.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python each platform's package ships with.
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2025
            python: '3.13'
          - os: macos-15
            python: '3.15'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libmpv2 ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install mpv and FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) reqs=windows/requirements-build.txt ;;
            macOS) reqs=macos/requirements-build.txt ;;
            *) reqs=runtime-requirements.txt ;;
          esac
          python -m pip install --upgrade pip
          # Linux packages take PyQt6 from the distribution; here it comes from pip.
          python -m pip install -r "$reqs" PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools

      - name: Build the C decoder
        id: native_decoder
        run: python packaging/build-native.py

      # Keep correctness and timing-sensitive benchmarks in fresh processes,
      # consistent with the successful Linux and Windows validation.
      - name: Run correctness tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Match macos/build-macos.sh: Python's ctypes loader does not
            # search Apple Silicon's Homebrew libmpv directory by default.
            mpv_lib="$(brew --prefix mpv)/lib"
            test -f "$mpv_lib/libmpv.2.dylib"
            export DYLD_FALLBACK_LIBRARY_PATH="$mpv_lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
            python -c 'import ctypes.util, mpv; print("libmpv:", ctypes.util.find_library("mpv"), "API:", mpv.MPV_VERSION)'
            command -v ffmpeg
            command -v ffprobe
          fi
          python -m pytest tests --ignore=tests/test_responsiveness.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra

      # faulthandler uses a process-wide native timer and inspects every
      # thread. Run its diagnostic tests away from unrelated GUI/network
      # fixtures on Windows; every test still runs and failure is gating.
      - name: Run correctness tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests --ignore=tests/test_responsiveness.py --ignore=tests/test_spinner_debug.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra

      - name: Run spinner diagnostics (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native_decoder.outcome == 'success' }}
        run: python -m pytest tests/test_spinner_debug.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra

      - name: Run responsiveness tests
        if: ${{ !cancelled() && steps.native_decoder.outcome == 'success' }}
        run: python -m pytest tests/test_responsiveness.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra

      # Temporary validation: repeat the complete suite without baseline or
      # diagnostic instrumentation. Each run must pass independently.
      - name: Repeat responsiveness suite five times on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.native_decoder.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for trial in 1 2 3 4 5; do
            echo "::group::Corrected repeat $trial"
            if ! python -m pytest tests/test_responsiveness.py -vv --tb=short -p no:cacheprovider --timeout=300 -ra; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

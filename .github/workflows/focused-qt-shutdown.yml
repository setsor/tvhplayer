name: Focused Qt shutdown fixture test

on:
  push:
    branches:
      - fix/4.7.6-compact-server-controls
  pull_request:
    paths:
      - 'tests/test_pyqt6_ui.py'
      - '.github/workflows/focused-qt-shutdown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2025
            python: '3.13'
          - os: macos-15
            python: '3.15'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libmpv2 ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) reqs=windows/requirements-build.txt ;;
            macOS) reqs=macos/requirements-build.txt ;;
            *) reqs=runtime-requirements.txt ;;
          esac
          python -m pip install --upgrade pip
          python -m pip install -r "$reqs" PyQt6 pytest pytest-timeout pyyaml python-dateutil setuptools
          python packaging/build-native.py
      - name: Run only the web UI close fixture test
        run: python -X faulthandler -m pytest -vv -s --tb=long --timeout=120 -p no:cacheprovider tests/test_pyqt6_ui.py -k test_opening_builtin_web_ui_does_not_copy_a_password
      - name: Run the next shutdown test independently
        run: python -X faulthandler -m pytest -vv -s --tb=long --timeout=120 -p no:cacheprovider tests/test_pyqt6_ui.py -k test_quit_asks_the_builtin_server_even_when_another_is_selected
      - name: Run the idle-logo test independently
        run: python -X faulthandler -m pytest -vv -s --tb=long --timeout=120 -p no:cacheprovider tests/test_pyqt6_ui.py -k test_the_idle_logo_shrinks_with_the_player
      - name: Run the Windows timeshift shortcut test independently
        if: runner.os == 'Windows'
        run: python -X faulthandler -m pytest -vv -s --tb=long --timeout=120 -p no:cacheprovider tests/test_pyqt6_ui.py -k 'test_builtin_server_records_through_one_window and buffer-local_shortcut'
      - name: Run the complete PyQt6 UI test module
        run: python -X faulthandler -m pytest -vv --tb=long --timeout=300 -p no:cacheprovider tests/test_pyqt6_ui.py

name: Verify channel-scoped player recording controls

on:
  push:
    branches:
      - ci/verify-player-current-channel-dvr-20261101
    paths:
      - .github/workflows/verify-player-current-channel-dvr-20261101.yml

permissions:
  contents: read

jobs:
  ui-and-dvr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout exact fix commit
        uses: actions/checkout@v7
        with:
          ref: 6f1838b774c714c8e7967499dffdfa130f9f645f
          persist-credentials: false
      - name: Configure Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Qt runtime and application
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e . pytest
          python -m pip check
      - name: Check player Record and Stop against current channel
        run: |
          python -m pytest -q tests/test_pyqt6_ui.py \
            -k 'test_spinner_shows_until_playback_starts or test_record_controls_follow_the_playing_channel_not_the_selected_row or test_stop_channel_does_not_stop_an_unrelated_single_recording or test_record_command_uses_playing_channel_not_list_selection or test_player_bar_play_stop_and_record_controls or test_server_stop_timeout_does_not_repeat_an_uncertain_rpc'
      - name: Check local recording and Tasks separately
        run: |
          python -m pytest -q tests/test_pyqt6_ui.py \
            -k 'test_local_recording_saves_to_the_settings_folder_and_stops_on_time or test_several_channels_record_to_this_computer_at_once or test_flatpak_asks_for_the_recordings_folder_once or test_conversions_show_in_tasks_and_follow_a_recording'
      - name: Check DVR data and source syntax
        run: |
          python -m pytest -q tests/test_models.py tests/test_dvr_api.py tests/test_recorder.py
          python -m py_compile tvhplayer/tvhplayer.py tvhplayer/player_bar.py tests/test_pyqt6_ui.py
